[project]
name = "vitalwatch"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "PyMySQL>=1.1.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0"
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "run:app"
