<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASHA Profile — VitalWatch</title>
  <meta name="description" content="ASHA Worker profile and assigned village jurisdictions.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --font: 'Inter', system-ui, sans-serif;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-blur: blur(16px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 64px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-secondary); padding: 6px 14px; border-radius: var(--radius-sm);
      font-size: 0.82rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: var(--transition); font-family: var(--font);
    }
    .back-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
    .topbar h1 { font-size: 1.05rem; font-weight: 700; }

    .btn-logout {
      display: flex; align-items: center; gap: 6px;
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; padding: 6px 14px; border-radius: var(--radius-sm);
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: var(--transition); font-family: var(--font);
    }
    .btn-logout:hover { background: rgba(239,68,68,0.25); transform: translateY(-1px); }

    /* Main layout */
    .main { max-width: 800px; margin: 0 auto; padding: 36px 24px 60px; }

    /* Profile card */
    .profile-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 28px;
      animation: fadeIn 0.4s ease both;
    }

    .profile-header {
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 28px; padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .avatar-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: rgba(99,102,241,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: var(--accent); flex-shrink: 0;
    }
    .profile-name h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    .profile-name .role-pill {
      display: inline-block;
      background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3);
      color: #818cf8; padding: 3px 12px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em;
    }

    /* Info grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .info-grid { grid-template-columns: 1fr; }
      .profile-header { flex-direction: column; text-align: center; }
    }

    .info-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
    }
    .info-label { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 4px; }
    .info-value { font-size: 1rem; font-weight: 600; color: var(--text-primary); }

    /* Assigned Villages section */
    .villages-section h3 {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .villages-count { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }

    .village-chips {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px;
    }
    .village-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      padding: 8px 14px; border-radius: 99px;
      font-size: 0.85rem; font-weight: 500;
    }

    .badge-mini {
      font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 99px;
    }
    .risk-LOW { background: rgba(16,185,129,0.18); color: #34d399; }
    .risk-MEDIUM { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .risk-HIGH { background: rgba(239,68,68,0.18); color: #f87171; }

    .action-links { display: flex; gap: 12px; }
    @media (max-width: 500px) { .action-links { flex-direction: column; } }

    .btn-link-action {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: var(--transition); font-family: var(--font);
    }
    .btn-primary-link {
      background: var(--accent); color: white; border: none;
    }
    .btn-primary-link:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .btn-secondary-link {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-primary);
    }
    .btn-secondary-link:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="/asha/dashboard" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
      <h1><i class="fa-solid fa-id-card" style="color:var(--accent); margin-right:8px;"></i>ASHA Profile</h1>
    </div>
    <button class="btn-logout" id="logout-btn">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar-icon"><i class="fa-solid fa-user-nurse"></i></div>
        <div class="profile-name">
          <h2 id="worker-name">Loading...</h2>
          <span class="role-pill">ASHA Worker</span>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <div class="info-label"><i class="fa-solid fa-id-badge" style="margin-right:6px;"></i>Employee ID</div>
          <div class="info-value" id="worker-emp-id">—</div>
        </div>
        <div class="info-item">
          <div class="info-label"><i class="fa-solid fa-phone" style="margin-right:6px;"></i>Phone Number</div>
          <div class="info-value" id="worker-phone">—</div>
        </div>
        <div class="info-item">
          <div class="info-label"><i class="fa-solid fa-envelope" style="margin-right:6px;"></i>Email Address</div>
          <div class="info-value" id="worker-email">—</div>
        </div>
        <div class="info-item">
          <div class="info-label"><i class="fa-solid fa-map-location-dot" style="margin-right:6px;"></i>Assigned Jurisdiction</div>
          <div class="info-value" id="worker-jurisdiction">— Villages</div>
        </div>
      </div>

      <div class="villages-section">
        <h3>
          <span>Assigned Villages</span>
          <span class="villages-count" id="villages-count">0 total</span>
        </h3>
        <div class="village-chips" id="village-chips">
          <div style="color:var(--text-secondary); font-size:0.85rem;">Loading assigned villages...</div>
        </div>
      </div>

      <div class="action-links">
        <a href="/asha/villages" class="btn-link-action btn-primary-link">
          <i class="fa-solid fa-shield-halved"></i> View Full Village Risk Map
        </a>
        <a href="/asha/dashboard" class="btn-link-action btn-secondary-link">
          <i class="fa-solid fa-gauge-high"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </main>

  <script>
    const TOKEN_KEY = "vitalwatch_token";
    const USER_KEY  = "vitalwatch_user";
    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function getUser()  {
      try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch { return null; }
    }

    // Auth guard
    const token = getToken();
    const user  = getUser();
    if (!token || !user || user.role !== "ASHA_WORKER") {
      window.location.href = "/";
    }

    // Logout
    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      window.location.href = "/";
    });

    async function loadProfile() {
      try {
        const res = await fetch("/api/asha/profile", {
          headers: { "Authorization": "Bearer " + getToken() }
        });
        if (!res.ok) throw new Error("Failed to load profile");
        const data = await res.json();
        const profile = data.profile || {};
        const villages = profile.villages || [];

        document.getElementById("worker-name").textContent = profile.name || user.full_name || "ASHA Worker";
        document.getElementById("worker-email").textContent = profile.email || user.email || "—";
        document.getElementById("worker-phone").textContent = profile.phone || "Not set";
        document.getElementById("worker-emp-id").textContent = profile.employee_id || "—";
        document.getElementById("worker-jurisdiction").textContent = villages.length + " Villages";
        document.getElementById("villages-count").textContent = villages.length + " assigned";

        const chipsEl = document.getElementById("village-chips");
        if (villages.length === 0) {
          chipsEl.innerHTML = '<div style="color:var(--text-secondary); font-size:0.85rem;">No villages assigned yet.</div>';
          return;
        }

        chipsEl.innerHTML = villages.map(v => `
          <div class="village-chip">
            <i class="fa-solid fa-location-dot" style="color:var(--accent);"></i>
            <span>${v.name}</span>
            <span class="badge-mini risk-${v.risk_level}">${v.risk_level}</span>
          </div>
        `).join("");
      } catch (err) {
        console.error(err);
      }
    }

    loadProfile();
  </script>
</body>
</html>
