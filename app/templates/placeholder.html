<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — VitalWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --font: 'Inter', system-ui, sans-serif;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --accent: #6366f1;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8;
      --radius: 16px; --radius-sm: 10px;
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --glass-blur: blur(16px);
      --transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg-gradient); min-height: 100vh; color: var(--text-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; -webkit-font-smoothing: antialiased; }

    .card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 48px 40px;
      max-width: 500px; width: 90%;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    .icon-wrap {
      width: 64px; height: 64px; border-radius: 18px;
      background: rgba(99,102,241,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: var(--accent);
      margin: 0 auto 20px;
    }
    .role-badge {
      display: inline-block;
      background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.3);
      color: #818cf8; padding: 4px 14px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
    p  { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 28px; }

    .btn-logout {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; padding: 10px 20px; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: var(--transition); font-family: var(--font);
    }
    .btn-logout:hover { background: rgba(239,68,68,0.22); transform: translateY(-1px); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap"><i class="fa-solid fa-heart-pulse"></i></div>
    <div class="role-badge" id="role-badge">—</div>
    <h1>Dashboard Coming Soon</h1>
    <p>Your personalized dashboard is under development.<br>You're logged in and your account is active.</p>
    <button class="btn-logout" id="logout-btn">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
  </div>

  <script>
    const TOKEN_KEY = "vitalwatch_token";
    const USER_KEY  = "vitalwatch_user";

    const user = (() => { try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch { return null; }})();
    if (!localStorage.getItem(TOKEN_KEY) || !user) { window.location.href = "/"; }

    // Display role
    if (user) {
      document.getElementById("role-badge").textContent = (user.role || "").replace(/_/g, " ");
    }

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      window.location.href = "/";
    });
  </script>
</body>
</html>
