<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Village Risk Map — VitalWatch ASHA</title>
  <meta name="description" content="Village risk overview for assigned ASHA worker areas.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --font: 'Inter', system-ui, sans-serif;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --accent: #6366f1;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --radius: 16px; --radius-sm: 10px;
      --transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --glass-blur: blur(16px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg-gradient); min-height: 100vh; color: var(--text-primary); -webkit-font-smoothing: antialiased; }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 64px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-secondary); padding: 6px 14px; border-radius: var(--radius-sm);
      font-size: 0.82rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: var(--transition); font-family: var(--font);
    }
    .back-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
    .topbar h1 { font-size: 1.05rem; font-weight: 700; }

    /* Main */
    .main { max-width: 800px; margin: 0 auto; padding: 36px 24px 60px; }
    .page-title { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; }
    .page-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 32px; }

    /* Village list */
    .village-list { display: flex; flex-direction: column; gap: 14px; }

    .village-card {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius);
      padding: 18px 22px;
      transition: var(--transition);
      animation: fadeIn 0.4s ease both;
    }
    .village-card:hover { transform: translateX(4px); background: rgba(255,255,255,0.07); }

    .village-info h3 { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
    .village-info p  { font-size: 0.82rem; color: var(--text-secondary); }
    .village-info p i { margin-right: 4px; }

    /* Risk badges */
    .risk-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 99px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .risk-LOW    { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .risk-MEDIUM { background: rgba(245,158,11,0.15);  color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .risk-HIGH   { background: rgba(239,68,68,0.15);   color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    /* Empty state */
    .empty { text-align: center; color: var(--text-secondary); padding: 60px 0; }
    .empty i { font-size: 2.5rem; margin-bottom: 12px; display: block; opacity: 0.4; }

    /* Loading */
    .loading { text-align: center; color: var(--text-secondary); padding: 60px 0; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <a href="/asha/dashboard" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
      <h1><i class="fa-solid fa-shield-halved" style="color:#6366f1; margin-right:8px;"></i>Village Risk Map</h1>
    </div>
  </header>

  <main class="main">
    <h2 class="page-title">Assigned Villages</h2>
    <p class="page-sub">Risk levels of villages under your supervision.</p>

    <div id="village-list" class="village-list">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading villages…</div>
    </div>
  </main>

  <script>
    const TOKEN_KEY = "vitalwatch_token";
    const USER_KEY  = "vitalwatch_user";
    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function getUser()  {
      try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch { return null; }
    }

    // Auth guard
    const token = getToken();
    const user  = getUser();
    if (!token || !user || user.role !== "ASHA_WORKER") {
      window.location.href = "/";
    }

    const RISK_ICON = { LOW: "fa-circle-check", MEDIUM: "fa-circle-exclamation", HIGH: "fa-triangle-exclamation" };

    async function loadVillages() {
      const container = document.getElementById("village-list");
      try {
        const res = await fetch("/api/asha/villages", {
          headers: { "Authorization": "Bearer " + getToken() }
        });
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        const villages = data.villages || [];

        if (villages.length === 0) {
          container.innerHTML = `<div class="empty"><i class="fa-solid fa-map-pin"></i><p>No villages assigned yet.</p></div>`;
          return;
        }

        // Sort: HIGH first, then MEDIUM, then LOW
        const order = { HIGH: 0, MEDIUM: 1, LOW: 2 };
        villages.sort((a, b) => (order[a.risk_level] ?? 3) - (order[b.risk_level] ?? 3));

        container.innerHTML = villages.map((v, i) => `
          <div class="village-card" style="animation-delay:${i * 0.06}s">
            <div class="village-info">
              <h3><i class="fa-solid fa-location-dot" style="color:#6366f1;margin-right:6px;"></i>${v.name}</h3>
              <p><i class="fa-solid fa-map"></i>${v.district} District</p>
            </div>
            <span class="risk-badge risk-${v.risk_level}">
              <i class="fa-solid ${RISK_ICON[v.risk_level] || 'fa-circle'}"></i>
              ${v.risk_level}
            </span>
          </div>
        `).join("");
      } catch (e) {
        container.innerHTML = `<div class="empty"><i class="fa-solid fa-circle-xmark"></i><p>Could not load villages. Please try again.</p></div>`;
      }
    }

    loadVillages();
  </script>
</body>
</html>
