# Spring Boot + MySQL Configuration for VitalWatch
spring.application.name=vitalwatch-cases

# Server port (default 8080)
server.port=8080

# MySQL DataSource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vitalwatch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

